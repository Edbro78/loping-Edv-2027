<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinnerne av Bergen City Marathon 2024–2026</title>
<!--
  Bergen City Marathon 2024–2026 – interaktiv løpsanalyse
  ----------------------------------------------------------------------------
  Én HTML-fil med HTML, CSS og vanlig JavaScript. Ingen byggesteg.
  Avhengigheter:
    • fonts/SoderbergSans-*Italic.otf  (ligger ved siden av denne filen)
    • Boxicons 2.1.4 fra unpkg (ikoner)
  Innbygging i egen fane:

-->
<link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
<style>
/* ===== 1. Font (samme Archivo som resten av løpeguiden) ===== */
@font-face{font-family:"Archivo Variable";src:url("fonts/archivo-latin-standard-normal.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}

/* ===== 2. Designtokens (samme palett som løpeguiden) ===== */
:root{
  --font:"Archivo Variable","Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --navy:#12304a; --blue:#d03808; --blue-hover:#f05a1a; --blue-100:#fde8dc;
  --orange:#f05a1a; --orange-600:#d03808; --orange-700:#d03808; --orange-border:#f6c2ae; --orange-bg:#fde8dc;
  --gray-50:#f6f1ee; --gray-100:#e9eef0; --gray-200:#d5dfe7; --gray-300:#c5d0da; --gray-400:#8aa3b8;
  --gray-500:#2f5573; --gray-600:#2f5573; --gray-700:#12304a;
  --white:#ffffff;
}

/* ===== 3. Grunnstiler ===== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--gray-50);color:var(--navy);font-family:var(--font);-webkit-font-smoothing:antialiased}
#bcm,#bcm button,#bcm input{font-family:var(--font);font-style:normal}
#bcm{color:var(--navy);background:var(--gray-50);min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-hover);text-decoration:underline}
h1,h2,h3,p{margin:0}
input[type=range]{accent-color:var(--orange);width:100%;height:28px;cursor:pointer;margin:0}
svg{display:block}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}#bcm *{transition:none!important}}

/* ===== 4. Layout og komponenter ===== */
.wrap{max-width:1160px;margin:0 auto;padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:48px}
.col{display:flex;flex-direction:column}
.section{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:8px}
.head-row{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-700)}
h2{font-size:clamp(28px,3vw,36px);line-height:1.1;font-weight:750;font-stretch:75%;letter-spacing:-0.01em;color:var(--navy)}
h3{font-size:22px;font-weight:700;line-height:1.25;font-stretch:75%;letter-spacing:-0.01em;color:var(--navy)}
.lead{font-size:16px;line-height:24px;color:var(--gray-600)}
.muted{color:var(--gray-500)}
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:10px}
.sub{font-size:14px;color:var(--gray-500)}
.lbl{font-size:13px;color:var(--gray-500)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--gray-600)}
.legend>span{display:flex;align-items:center;gap:6px}
.rel{position:relative}
.ico{color:var(--orange-600)}

/* Header */
.hero{
  background:
    radial-gradient(900px 280px at 12% 0%, rgb(255 176 90 / 0.45), transparent 60%),
    linear-gradient(115deg, #ff7a2f 0%, #f05a1a 46%, #e24a0c 100%);
  color:#fff;border-radius:0;padding:clamp(28px,5vw,56px) clamp(16px,4vw,40px);
  margin:calc(clamp(16px,4vw,40px) * -1) calc(clamp(16px,4vw,40px) * -1) 0;
  display:flex;flex-direction:column;gap:32px}
.hero h1{font-weight:800;font-stretch:75%;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-0.01em;color:#fff;text-wrap:balance}
.hero p{font-size:clamp(17px,2vw,20px);line-height:1.5;color:#fff;text-wrap:pretty}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--white);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:clamp(28px,3.4vw,40px);white-space:nowrap;font-weight:600;line-height:1.1;letter-spacing:-.02em;color:var(--navy)}
.kpi span{font-size:14px;line-height:20px;color:var(--gray-600)}
.kpi.dark{background:#0c2236}.kpi.dark b{color:#fff}.kpi.dark span{color:#fde8dc}

/* Navigasjon */
.nav{position:sticky;top:0;z-index:5;background:rgba(249,250,251,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin:-24px 0;padding:12px 0;display:flex;gap:8px;overflow-x:auto}
.nav a{flex:none;padding:8px 14px;border-radius:100px;border:1px solid var(--gray-200);background:var(--white);font-size:14px;font-weight:500;color:var(--navy);text-decoration:none}
.nav a:hover{background:var(--orange-bg);border-color:var(--orange-border);text-decoration:none;color:var(--navy)}

/* Innsiktskort */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.insight{padding:24px;display:flex;flex-direction:column;gap:12px}
.insight i{font-size:28px}
.insight p{font-size:15px;line-height:24px;color:var(--gray-600);text-wrap:pretty}

/* Segmentkontroll */
.seg{display:flex;gap:2px;padding:3px;background:var(--gray-100);border-radius:999px}
.seg button{border:none;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:650;cursor:pointer;background:transparent;color:var(--navy)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 8px 24px rgb(18 48 74 / 0.18)}

/* Badge og knapp (designsystemet) */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:4px 12px;border-radius:100px;line-height:1.3;white-space:nowrap}
.badge.brand{background:var(--blue-100);color:var(--blue)}
.badge.warning{background:var(--orange-bg);color:var(--orange-700)}
.badge.neutral{background:var(--gray-100);color:var(--gray-700)}
.btn{font-weight:650;cursor:pointer;border-radius:999px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;transition:background .15s,border-color .15s,color .15s;font-size:15px;min-height:44px;padding:0 20px;background:var(--orange);color:#fff}
.btn:hover{background:var(--orange-600);color:#fff}
.btn i{font-size:18px}

/* Etiketter over SVG */
.lb{position:absolute;white-space:nowrap;pointer-events:none;line-height:1;text-shadow:0 0 3px #FFF,0 0 3px #FFF,0 0 3px #FFF}

/* Bryter */
.toggle{display:flex;align-items:center;gap:10px;border:none;background:none;font-size:14px;font-weight:500;color:var(--navy);cursor:pointer;padding:4px}
.toggle .track{width:40px;height:22px;border-radius:100px;position:relative;transition:background 200ms ease-out;flex:none}
.toggle .knob{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#FFF;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left 200ms ease-out}

/* Data-trekkspill */
.data-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;border:none;background:var(--white);cursor:pointer;color:var(--navy);text-align:left}
.data-btn:hover{background:var(--gray-50)}
</style>
</head>

/* =====================================================================

   ===================================================================== */
const P = s => { if (s == null) return null; const a = String(s).split(':').map(Number); return a.length === 3 ? a[0] * 3600 + a[1] * 60 + a[2] : a[0] * 60 + a[1]; };
const F = s => { s = Math.round(Math.abs(s)); const m = Math.floor(s / 60), r = s % 60; return m + ':' + String(r).padStart(2, '0'); };
const G = s => { const a = Math.abs(Math.round(s)); return a < 60 ? a + ' s' : F(a); };
const km = k => String(k).replace('.', ',');
const lap = k => k > 21.1 ? Math.min(21.1, k - 21.1) : k;
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const map = (list, fn) => list.map(fn).join('');

const GEO = (() => {
  const C = BCM_COURSE, p = C.p, n = p.length - 1, I = k => Math.max(0, Math.min(n, Math.round(k / C.step)));

  const cur = pts[idx], ax = DX(cur[0]);
  const last = n => n.split(' ').slice(-1)[0];
  const da = []; for (let k = 0; k <= total + 0.001; k += 0.1) da.push(DX(Math.min(k, total)).toFixed(1) + ',' + (DB - Gg.at(lap(Math.min(k, total)))[2] / 130 * (DB - DT) * 0.35).toFixed(1));
  const dc = {
    elev: DX(0) + ',' + DB + ' ' + da.join(' ') + ' ' + DX(total) + ',' + DB,
    ticks: dticks, line: ps.join(' '), prog: ps.slice(0, idx + 1).join(' '),
    area: DX(pts[0][0]).toFixed(1) + ',' + DY(0).toFixed(1) + ' ' + ps.join(' ') + ' ' + DX(pts[pts.length - 1][0]).toFixed(1) + ',' + DY(0).toFixed(1),
    dots: pts.map((q, i) => ({ i, cx: DX(q[0]), cy: DY(q[1]), r: i === idx ? 8 : 4.5, fill: i <= idx ? '#f05a1a' : '#FFFFFF' })),
    ax, aly: Math.max(16, DY(cur[1]) - 16), anchor: ax > 700 ? 'end' : ax < 100 ? 'start' : 'middle',
    alabel: cur[1] === 0 ? '±0' : (cur[1] > 0 ? '+' : '−') + G(cur[1]),
    xl: (isM ? [0, 10, 21.1, 31.1, 42.2] : [0, 5, 10, 15, 21.1]).map(k => ({ x: DX(k), label: k === 0 ? 'Start' : k === total ? 'Mål' : km(k) + ' km' })),
    max: pts.length - 1, idx, place: placeName(cur[0]),
    readout: cur[1] === 0 ? (cur[0] === 0 ? 'Start' : 'Side om side') : cur[1] > 0 ? last(race.navn) + ' leder med ' + G(cur[1]) : last(race.rival) + ' leder med ' + G(cur[1])
  };
  const dKm = cur[0], dLap = lap(dKm), r2 = isM && dKm > 21.1;
  const dmap = { base: r2 ? '#e2a63a' : '#e9eef0', done: Gg.pts(0, dLap), x: Gg.at(dLap)[0], y: Gg.at(dLap)[1], label: (isM ? (dKm > 21.1 ? 'Runde 2 · ' : 'Runde 1 · ') : '') + placeName(dKm) };

  // --- Løypa: kart og høydeprofil ---
  const ch = hoyde(...COURSE_AB[s.course]);
  const course = { ...D.course[s.course], hoyde: ch.t, hoydeSub: ch.s };
  const st = Gg.at(0);
  const mapV = {
    vb: '-80 -60 1160 ' + (Gg.C.h + 120), all: Gg.all,
    segs: COURSE_AB.map(([a, b], i) => ({ i, pts: Gg.pts(a, b), color: TERR_FILL[D.course[i].terr], sw: i === s.course ? 34 : 22, op: i === s.course ? 1 : 0.45 })),
    drinks: DRINKS_KM.map(k => { const q = Gg.at(k); return { x: q[0], y: q[1] }; }),
    cps: CP_KM.map(k => { const q = Gg.at(k); const left = q[0] > 640; return { x: q[0], y: q[1], tx: q[0] + (left ? -34 : 34), anchor: left ? 'end' : 'start', label: km(k) }; }),
    sx: st[0], sy: st[1], stx: st[0] - 44, sty: st[1] + 14,
    hasHover: s.hoverKm != null, hx: s.hoverKm != null ? Gg.at(s.hoverKm)[0] : 0, hy: s.hoverKm != null ? Gg.at(s.hoverKm)[1] : 0
  };
  const PL = 44, PW = 744, PT = 16, PB = 192, PX = k => PL + k / 21.1 * PW, PY = e => PB - e / 130 * (PB - PT);
  const pline = k0 => { const a = []; for (let i = Gg.I(k0[0]); i <= Gg.I(k0[1]); i++) a.push(PX(i * Gg.C.step).toFixed(1) + ',' + PY(Gg.p[i][2]).toFixed(1)); return a; };
  const hk = s.hoverKm;
  const prof = {
    ticks: [0, 50, 100].map(v => ({ y: PY(v), label: v + ' m' })),
    areas: COURSE_AB.map(([a, b], i) => ({ pts: PX(a) + ',' + PB + ' ' + pline([a, b]).join(' ') + ' ' + PX(b) + ',' + PB, color: TERR_FILL[D.course[i].terr], op: i === s.course ? 1 : 0.35 })),
    line: pline([0, 21.1]).join(' '),
    cps: CP_KM.map(k => ({ x: PX(k) })),
    drinks: DRINKS_KM.map(k => ({ x: PX(k), y: PY(Gg.at(k)[2]) - 10 })),
    xl: [0, 4.6, 8.2, 10, 15.9, 17.9, 21.1].map(k => ({ x: PX(k), label: k === 0 ? 'Start' : k === 21.1 ? 'Mål' : km(k) })),
    hasHover: hk != null, hx: hk != null ? PX(hk) : 0, hy: hk != null ? PY(Gg.at(hk)[2]) : 0,
    anchor: hk != null && hk > 18 ? 'end' : hk != null && hk < 3 ? 'start' : 'middle',
    hlabel: hk != null ? km(hk.toFixed(1)) + ' km · ' + Gg.at(hk)[2] + ' moh' : ''
  };

  // --- Bakkene ---
  const hlo = 180, hhi = s.hillDist === 'm' ? 290 : 250;
  const pct = v => ((v - hlo) / (hhi - hlo) * 100).toFixed(2) + '%';
  const hills = D.hills[s.hillDist].map(([n, h, f]) => { const fh = P(h), ff = P(f); return { navn: n, hill: 'Bakke ' + h, flat: 'Flatt ' + f, add: '+' + (fh - ff) + ' s', fl: pct(ff), hl: pct(fh), w: ((fh - ff) / (hhi - hlo) * 100).toFixed(2) + '%' }; });
  const hillTicks = (s.hillDist === 'm' ? [180, 210, 240, 270] : [180, 200, 220, 240]).map(t => ({ pct: pct(t), label: F(t) }));
  const add = s.hillDist === 'm' ? [33, 41, 2.4] : [7, 18, 3.6];
  const calc = { flat: F(s.flatPace), hill: F(s.flatPace + add[0]) + '–' + F(s.flatPace + add[1]) + ' /km', dist: km(add[2]) + ' km bakke', cost: '+' + G(add[0] * add[2]) + ' til +' + G(add[1] * add[2]) };

  // --- Splittene ---
  const sl = D.splits[s.splitDist], smax = Math.max(...sl.map(r => Math.abs(r[1])));
  const splits = sl.map(([n, v, note]) => {
    const w = Math.abs(v) / smax * 46;
    const lab = (v > 0 ? '+' : '−') + (s.splitDist === 'hm' ? Math.abs(v) + ' s/km' : F(v)) + (note ? ' (' + note + ')' : '');
    return { navn: n, color: v > 0 ? '#f05a1a' : '#12304a', left: (v > 0 ? 50 : 50 - w) + '%', w: Math.max(w, 0.8) + '%', label: lab, tl: (v > 0 ? 50 + w : 50 - w) + '%', tt: v > 0 ? 'translateX(8px)' : 'translateX(calc(-100% - 8px))' };
  });

  // --- Augustsons runder ---
  const rmax = 170;
  const rounds = D.rounds.map(([y, a1, a2, b1, b2]) => { const da = P(a2) - P(a1), db = P(b2) - P(b1); return { year: y, da: '+' + F(da), db: '+' + F(db), ha: (da / rmax * 82) + '%', hb: (db / rmax * 82) + '%', sub: y === 2024 ? 'Jevnt etter Haraldsplass' : y === 2025 ? 'Tapet kom på slutten' : 'Største fall' }; });

  // --- Etiketter ---
  const mvb = mapV.vb.split(' ').map(Number);
  const labels = {
    pc: LB(0, 0, 800, 300, [...pc.ticks.map(t => ({ x: 44, y: t.y, label: t.label, a: 'end' })), ...pc.bars.map(b => ({ x: b.lx, y: b.ly + 4, label: b.label, v: 'bottom', fw: 600, c: '#12304a' })), ...pc.xl.map(x => ({ x: x.x, y: 280, label: x.label }))]),
    dc: LB(0, 0, 800, 240, [...dc.ticks.map(t => ({ x: 44, y: t.y, label: t.label, a: 'end' })), { x: dc.ax, y: dc.aly + 4, label: dc.alabel, a: dc.anchor, v: 'bottom', fs: 14, fw: 700, c: '#12304a' }, ...dc.xl.map(x => ({ x: x.x, y: 226, label: x.label }))]),
    map: LB(mvb[0], mvb[1], mvb[2], mvb[3], mapV.cps.map(c => ({ x: c.tx, y: c.y, label: c.label, a: c.anchor, fs: 13, fw: 700, c: '#12304a' }))),
    prof: LB(0, 0, 800, 224, [...prof.ticks.map(t => ({ x: 36, y: t.y, label: t.label, a: 'end' })), ...prof.xl.map(x => ({ x: x.x, y: 212, label: x.label })), ...(prof.hasHover ? [{ x: prof.hx, y: 10, label: prof.hlabel, a: prof.anchor, fw: 700, c: '#12304a' }] : [])])
  };

  return {
    s, race, course, map: mapV, prof, dmap, labels, pc, segInfo, dc, rounds, hills, hillTicks, calc, splits,
    distOpts: opts([['hm', 'Halvmaraton'], ['m', 'Maraton']], s.dist, 'dist'),
    genderOpts: opts([['menn', 'Menn'], ['kvinner', 'Kvinner']], s.gender, 'gender'),
    yearOpts: opts([[2024, '2024'], [2025, '2025'], [2026, '2026']], s.year, 'year'),
    hillOpts: opts([['m', 'Maraton'], ['hm', 'Halvmaraton']], s.hillDist, 'hillDist'),
    splitOpts: opts([['hm', 'Halvmaraton'], ['m', 'Maraton']], s.splitDist, 'splitDist'),
    splitTone: race.splitType === 'Positiv' ? 'warning' : race.splitType === 'Negativ' ? 'brand' : 'neutral',
    raceTitle: (isM ? 'Maraton ' : 'Halvmaraton ') + s.gender + ' ' + s.year,
    overlayLegend: YEARS.filter(y => y !== s.year).map(y => ({ label: y + ': ' + D.races[s.dist][s.gender][y].navn, color: YEAR_COLOR[y] })),
    hillSegLabel: s.hillDist === 'm' ? '3,2–5,6' : '4,6–8,2', hillLegend: s.hillDist === 'm' ? '(3,2–5,6 km)' : '(4,6–8,2 km)',
    splitTitle: s.splitDist === 'hm' ? 'Fem av seks løp negativ eller jevn split' : 'Bare Galleberg løp negativ split',
    splitSub: s.splitDist === 'hm' ? 'Forskjell i tempo mellom 0–10 km og 10 km–mål, sekunder per km.' : 'Andre halvdel minus første halvdel, total tid.'
  };
}

const labels = list => map(list, t => `<span class="lb" style="left:${t.l};top:${t.t};transform:${t.tf};font-size:${t.fs};font-weight:${t.fw};color:${t.c}">${esc(t.label)}</span>`);
const head = (eyebrow, title, lead, leadMax = 720) => `<div class="head"><span class="eyebrow">${eyebrow}</span><h2>${esc(title)}</h2>${lead ? `<p class="lead" style="max-width:${leadMax}px">${esc(lead)}</p>` : ''}</div>`;

/* =====================================================================
   7. RENDERING
   Minimal DOM-patching: oppdaterer eksisterende noder i stedet for å
   bytte dem ut, slik at CSS-overganger og skyveknapper fungerer.
   ===================================================================== */
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to); return; }
  if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
  for (const a of Array.from(from.attributes)) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for (const a of Array.from(to.attributes)) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (from.nodeName === 'INPUT' && from.value !== to.getAttribute('value')) from.value = to.getAttribute('value');
  const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
  tc.forEach((t, i) => { if (fc[i]) morph(fc[i], t); else from.appendChild(t); });
  for (let i = tc.length; i < fc.length; i++) fc[i].remove();
}
const root = document.getElementById('bcm');
const tpl = document.createElement('template');
function render() {
  tpl.innerHTML = template(compute());
  const next = tpl.content.firstElementChild;
  if (root.firstElementChild) morph(root.firstElementChild, next); else root.appendChild(next);
}

/* =====================================================================
   8. HENDELSER (delegert fra rotelementet)
   ===================================================================== */
const kmFromEvent = (e, svg) => { const r = svg.getBoundingClientRect(); const vx = (e.clientX - r.left) / r.width * 800; return Math.max(0, Math.min(21.1, (vx - 44) / 744 * 21.1)); };

root.addEventListener('click', e => {
  const prof = e.target.closest('[data-prof]');
  if (prof) { const k = kmFromEvent(e, prof); const i = COURSE_AB.findIndex(([a, b]) => k >= a && k <= b); if (i >= 0) setState({ course: i }); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const i = +el.dataset.i;
  switch (el.dataset.act) {
    case 'pick': { const raw = el.dataset.val; pick(el.dataset.key, isNaN(+raw) ? raw : +raw); break; }
    case 'course': setState({ course: i }); break;
    case 'seg': setState({ seg: i }); break;
    case 'duel': clearInterval(timer); setState({ duelIdx: i, playing: false }); break;
    case 'play': onPlay(); break;
    case 'overlay': setState({ overlay: !state.overlay }); break;
    case 'data': setState({ showData: !state.showData }); break;
  }
});
root.addEventListener('mouseover', e => {
  const bar = e.target.closest('[data-act="seg"]');
  if (bar && +bar.dataset.i !== state.seg) setState({ seg: +bar.dataset.i });
});
root.addEventListener('mousemove', e => {
  const prof = e.target.closest('[data-prof]');
  if (prof) setState({ hoverKm: kmFromEvent(e, prof) });
});
root.addEventListener('mouseout', e => {
  const prof = e.target.closest('[data-prof]');
  if (prof && !prof.contains(e.relatedTarget) && state.hoverKm != null) setState({ hoverKm: null });
});
root.addEventListener('input', e => {
  const act = e.target.dataset.act;
  if (act === 'duelRange') { clearInterval(timer); setState({ duelIdx: +e.target.value, playing: false }); }
  else if (act === 'flatRange') setState({ flatPace: +e.target.value });
});

render();
if (CONFIG.autoplayDuel) setTimeout(onPlay, 600);
</script>
